<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-cfg-title="Checkout — ">Checkout</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="site-nav">
  <div class="wrap">
    <a href="index.html" class="brand">
      <span class="mark" data-cfg="initials">BT</span>
      <span data-cfg="shortName">Restaurant</span>
    </a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="menu.html">Menu</a>
    </div>
    <div class="nav-actions">
      <a href="menu.html" class="btn btn-ghost">← Back to menu</a>
    </div>
  </div>
</nav>

<section class="section" style="padding-top:56px">
  <div class="wrap" style="display:grid; grid-template-columns:1.1fr .9fr; gap:50px; align-items:flex-start;">

    <div>
      <div class="eyebrow">Checkout</div>
      <h2 style="font-size:34px">Where's this going?</h2>

      <form id="checkoutForm">
        <div class="toggle-row">
          <button type="button" class="toggle-opt active" data-fulfillment="pickup">Pickup</button>
          <button type="button" class="toggle-opt" data-fulfillment="delivery">Delivery</button>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="fullName">Full name</label>
            <input type="text" id="fullName" required placeholder="e.g. Chinedu Okafor">
          </div>
          <div class="field">
            <label for="phone">Phone number</label>
            <input type="tel" id="phone" required placeholder="080X XXX XXXX">
          </div>
        </div>

        <div class="field">
          <label for="email">Email (for your receipt)</label>
          <input type="email" id="email" required placeholder="you@email.com">
        </div>

        <div class="field" id="addressField" style="display:none">
          <label for="address">Delivery address</label>
          <textarea id="address" rows="3" placeholder="Street, area, landmark"></textarea>
        </div>

        <div class="field">
          <label for="notes">Order notes (optional)</label>
          <textarea id="notes" rows="2" placeholder="Allergies, spice level, cutlery, etc."></textarea>
        </div>
      </form>
    </div>

    <div class="info-panel" style="font-family:var(--mono)">
      <div class="t-eyebrow" style="color:var(--pepper); font-size:10px; letter-spacing:.14em; text-transform:uppercase; margin-bottom:10px;">Order ticket</div>
      <div id="checkoutItems" style="margin-bottom:14px;"></div>
      <div class="t-row"><span>Subtotal</span><span id="coSubtotal">₦0</span></div>
      <div class="t-row" id="deliveryFeeRow" style="display:none"><span>Delivery fee</span><span id="coDeliveryFee">₦1,500</span></div>
      <div class="t-row total"><span>Total</span><span id="coTotal">₦0</span></div>
      <button class="btn btn-primary btn-block" id="payBtn" style="margin-top:18px">Pay with Paystack</button>
      <p style="font-size:11px; color:var(--taupe); margin-top:12px;">Card, bank transfer or USSD via Paystack. Your order is confirmed automatically once payment clears.</p>
    </div>

  </div>
</section>

<div class="toast" id="toast"></div>

<script src="js/restaurant-config.js"></script>
<script src="js/apply-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/cart.js"></script>
<script src="https://js.paystack.co/v1/inline.js"></script>
<script src="js/checkout.js"></script>
</body>
</html>
