<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-cfg-title="Menu — ">Menu</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="site-nav">
  <div class="wrap">
    <a href="index.html" class="brand">
      <span class="mark" data-cfg="initials">BT</span>
      <span data-cfg="shortName">Restaurant</span>
    </a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="menu.html" class="active">Menu</a>
      <a href="index.html#about">About</a>
      <a href="index.html#visit">Visit</a>
    </div>
    <div class="nav-actions">
      <button class="cart-btn" data-open-cart>
        Ticket <span class="count" data-cart-count>0</span>
      </button>
    </div>
  </div>
</nav>

<header class="hero" style="padding:70px 0 50px">
  <div class="wrap">
    <div class="eyebrow">Full menu</div>
    <h1 style="font-size:clamp(38px,6vw,64px)">WHAT'S<br><span class="line2">COOKING</span></h1>
    <p class="hero-lede">Made to order. Pickup or delivery.</p>
  </div>
</header>

<section class="section" style="padding-top:56px">
  <div class="wrap">
    <div class="cat-filter" id="catFilter">
      <button class="cat-chip active" data-cat="all">All</button>
    </div>
    <div class="dish-grid" id="menuGrid">
      <p style="color:var(--taupe)">Loading menu…</p>
    </div>
  </div>
</section>

<footer>
  <div class="wrap">
    <div class="foot-grid">
      <div class="foot-col">
        <h5 data-cfg="shortName">Restaurant</h5>
        <p style="max-width:220px" data-cfg="footerBlurb"></p>
      </div>
      <div class="foot-col">
        <h5>Order</h5>
        <a href="menu.html">Full menu</a>
        <a href="checkout.html">Checkout</a>
      </div>
      <div class="foot-col">
        <h5>Contact</h5>
        <a href="#" data-cfg="phone" data-cfg-href="phoneHref"></a>
        <a href="#" data-cfg-whatsapp>WhatsApp</a>
      </div>
      <div class="foot-col">
        <h5>Hours</h5>
        <p data-cfg="hoursLong"></p>
      </div>
    </div>
    <div class="foot-bottom">
      <span>© <span data-cfg-year></span> <span data-cfg="name"></span></span>
      <a href="admin/login.html" style="color:var(--taupe)">Staff login</a>
    </div>
  </div>
</footer>

<div class="cart-overlay" id="cartOverlay"></div>
<aside class="cart-drawer" id="cartDrawer">
  <div class="ticket-head">
    <button class="close-cart" id="closeCart">×</button>
    <div class="t-eyebrow">Order ticket</div>
    <h3>Your table</h3>
    <div class="ticket-meta"><span data-cfg="shortName"></span> · Pickup or delivery</div>
  </div>
  <div class="ticket-items" id="ticketItems"></div>
  <div class="ticket-foot">
    <div class="t-row"><span>Subtotal</span><span id="ticketSubtotal">₦0</span></div>
    <div class="t-row total"><span>Total</span><span id="ticketTotal">₦0</span></div>
    <button class="btn btn-primary btn-block" id="goToCheckout">Checkout →</button>
  </div>
</aside>
<div class="toast" id="toast"></div>

<script src="js/restaurant-config.js"></script>
<script src="js/apply-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/cart.js"></script>
<script src="js/menu.js"></script>
</body>
</html>
